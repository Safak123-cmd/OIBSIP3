<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter | Safa</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter">
        <div class="icon">🌡️</div>

        <p class="subtitle">SMART TEMPERATURE TOOL</p>
        <h1>Temperature Converter</h1>

        <p class="description">
            Convert temperatures easily between
            Celsius, Fahrenheit and Kelvin.
        </p>

        <label for="temperature">Enter Temperature</label>
        <input
            type="number"
            id="temperature"
            placeholder="e.g. 25"
            step="any"
        >

        <label for="unit">Convert From</label>
        <select id="unit">
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button id="convertButton" type="button">
            Convert Temperature →
        </button>

        <p id="error" role="alert"></p>

        <section class="results" aria-live="polite">
            <div class="result-card">
                <span>°C</span>
                <h2>Celsius</h2>
                <p id="celsius">--</p>
            </div>

            <div class="result-card">
                <span>°F</span>
                <h2>Fahrenheit</h2>
                <p id="fahrenheit">--</p>
            </div>

            <div class="result-card">
                <span>K</span>
                <h2>Kelvin</h2>
                <p id="kelvin">--</p>
            </div>
        </section>

        <footer>
            Created by Safa Koujalagi
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
